name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build & Test Shared Package
        run: |
          cd packages/shared
          npm install
          npm run build
          npm test
          npm pack

      - name: Build & Test Backend API
        run: |
          cd apps/api
          npm install
          npm run build
          npm test
          npm run test:perf

      - name: Build & Test Web Application
        run: |
          cd apps/web
          npm install
          npm run build
          npm test
